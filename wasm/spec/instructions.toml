# WebAssembly 3.0 instruction opcode table.
# GENERATED ONCE by tools/gen_instr_toml.py, joining the reference decoder
# (interpreter/binary/decode.ml: opcode + shape) with the §7.10 Index of
# Instructions (WebAssembly.pdf: canonical TEXT mnemonic), by opcode. This
# file is the artifact; regenerate only when the spec changes. `name` is the
# .wat text mnemonic. `operands` is the COMPLETE ordered immediate signature
# (§5.4 binary format, its own vocabulary): index kinds (funcidx/typeidx/…),
# blocktype, const types (i32/i64/f32/f64), memarg, laneidx, heaptype, castop,
# byte^16 / laneidx^16, and vec(...) forms. `shape` is a coarse summary of it,
# cross-checked against `operands`. `opcode` is a byte, or [prefix, sub] for
# 0xFB/0xFC/0xFD. memarg/memlane entries also carry `align` = natural alignment
# (log2), the default when the text format omits `align=` (from §6.5.6).
# `type` is the instruction's typing from the §7.10 Type column, in the
# spec's own notation (t/t1/t2 metavariables, stack-polymorphic t*);
# cross-checked against valid.ml's typing arrows where those are
# closed-form. `traps` is the COMPLETE set of execution-trap conditions,
# extracted from the reference interpreter (eval.ml Trapping arms; numeric
# ops via eval_num.ml dispatch into the ixx/fxx/convert raise sites;
# reduction instructions inherit from the instructions they expand to),
# spelled as the interpreter's trap messages. traps = [] means the spec
# defines no trap for the instruction. Host resource exhaustion (call
# depth) is not a trap and is not listed.
# 497 instructions. else (0x05) / end (0x0B) excluded (terminators).

